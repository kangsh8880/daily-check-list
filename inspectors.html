<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>점검자 관리 - K1 일상점검</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="assets/icon-192.png" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="logo-badge">K1</div><div><div class="title">일상점검</div><div class="subtitle">Daily Check List</div></div></div>
    <nav id="sidebarNav"></nav>
    <div class="nav-section-label">계정</div>
    <div id="sidebarWho" style="padding:0 8px 10px;"></div>
    <div class="nav-item" id="logoutBtn"><span class="ico">↩️</span><span>로그아웃</span></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div><div class="page-title">점검자 관리</div><div class="page-desc">점검자 등록/수정/삭제 및 역할(점검자/조치담당자/관리자) 지정</div></div>
      <div class="topbar-right"><button class="theme-toggle" id="themeToggle">🌙</button></div>
    </div>

    <div class="content">
      <div class="card">
        <div class="card-head">
          <h3>점검자 목록</h3>
          <button class="btn btn-primary" id="addInspectorBtn">+ 점검자 등록</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>이름</th><th>사번</th><th>소속</th><th>역할</th><th>PIN</th><th>배정 부품수</th><th style="width:120px;">관리</th></tr></thead>
            <tbody id="inspBody"><tr><td colspan="7" class="empty-state">불러오는 중...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="inspModalOverlay">
  <div class="modal" style="width:440px;">
    <div class="modal-header"><h3 id="inspModalTitle">점검자 등록</h3><div class="modal-close" onclick="DCL.closeModal('inspModalOverlay')">✕</div></div>
    <div class="modal-body">
      <input type="hidden" id="inspId" />
      <div class="form-row"><label>이름 *</label><input type="text" id="inspName" /></div>
      <div class="form-grid">
        <div class="form-row"><label>사번</label><input type="text" id="inspEmpNo" /></div>
        <div class="form-row"><label>소속</label><input type="text" id="inspDept" placeholder="예: 1라인 설비팀" /></div>
      </div>
      <div class="form-grid">
        <div class="form-row"><label>역할 *</label>
          <select id="inspRole">
            <option value="inspector">점검자</option>
            <option value="action_owner">조치담당자</option>
            <option value="admin">관리자</option>
          </select>
        </div>
        <div class="form-row"><label>PIN (선택, 4자리)</label><input type="text" id="inspPin" maxlength="4" placeholder="미설정시 PIN없이 로그인" /></div>
      </div>
      <div class="form-actions">
        <button class="btn" onclick="DCL.closeModal('inspModalOverlay')">취소</button>
        <button class="btn btn-primary" id="saveInspBtn">저장</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/ai-config.js"></script>
<script src="js/common.js"></script>
<script src="js/ai.js"></script>
<script src="js/inspectors.js"></script>
</body>
</html>
