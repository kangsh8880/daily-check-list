<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="page.types.pageTitle">부품유형 / 점검항목 템플릿 - K1 일상점검</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="assets/icon-192.png" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="logo-badge">K1</div><div><div class="title" data-i18n="common.brandTitle">일상점검</div></div></div>
    <nav id="sidebarNav"></nav>
    <div class="nav-section-label" data-i18n="common.accountLabel">계정</div>
    <div id="sidebarWho" style="padding:0 8px 10px;"></div>
    <div class="nav-item" id="logoutBtn"><span class="ico">↩️</span><span data-i18n="common.logout">로그아웃</span></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="topbar-titles"><div class="page-title" data-i18n="page.types.title">부품유형 / 점검항목 템플릿</div><div class="page-desc" data-i18n="page.types.desc">부품 유형을 정의하고, 유형별 표준 점검항목을 관리합니다</div></div>
      <div class="topbar-right"><button class="theme-toggle" id="themeToggle">🌙</button></div>
    </div>

    <div class="content">
      <div class="tabs">
        <div class="tab active" data-tab="types" data-i18n="page.types.tabTypes">부품유형</div>
        <div class="tab" data-tab="templates" data-i18n="page.types.templateTitle">점검항목 템플릿</div>
      </div>

      <!-- 부품유형 탭 -->
      <div id="tabTypes">
        <div class="card">
          <div class="card-head">
            <h3 data-i18n="page.types.listTitle">부품유형 목록</h3>
            <button class="btn btn-primary" id="addTypeBtn" data-i18n="page.types.addTypeBtn">+ 유형 등록</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th data-i18n="common.col.codePrefix">코드접두어</th><th data-i18n="common.col.typeName">유형명</th><th data-i18n="common.col.description">설명</th><th data-i18n="page.types.colItemCount">점검항목 수</th><th style="width:120px;" data-i18n="common.col.manage">관리</th></tr></thead>
              <tbody id="typesBody"><tr><td colspan="5" class="empty-state" data-i18n="common.loading">불러오는 중...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 점검항목 템플릿 탭 -->
      <div id="tabTemplates" style="display:none;">
        <div class="card">
          <div class="card-head">
            <h3 data-i18n="page.types.templateTitle">점검항목 템플릿</h3>
            <div class="flex gap-8">
              <select id="templateTypeSelect" style="width:220px;"></select>
              <button class="btn btn-primary" id="addItemBtn" data-i18n="page.types.addItemBtn">+ 항목 추가</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th style="width:56px;" data-i18n="common.col.order">순서</th><th data-i18n="common.col.itemName">점검항목명</th><th data-i18n="common.col.judgeType">판정유형</th><th data-i18n="page.types.colUnitCriteria">단위/기준</th><th data-i18n="page.types.colPhotoRequired">사진필수</th><th style="width:100px;" data-i18n="common.col.manage">관리</th></tr></thead>
              <tbody id="itemsBody"><tr><td colspan="6" class="empty-state" data-i18n="page.types.selectTypeFirst">부품유형을 선택하세요</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 부품유형 등록/수정 모달 -->
<div class="modal-overlay" id="typeModalOverlay">
  <div class="modal" style="width:460px;">
    <div class="modal-header"><h3 id="typeModalTitle" data-i18n="page.types.typeModalTitleNew">부품유형 등록</h3><div class="modal-close" onclick="DCL.closeModal('typeModalOverlay')">✕</div></div>
    <div class="modal-body">
      <input type="hidden" id="typeId" />
      <div class="form-row"><label data-i18n="page.types.typeNameLabel">유형명 *</label><input type="text" id="typeName" placeholder="예: 모터" data-i18n-placeholder="page.types.typeNamePlaceholder" /></div>
      <div class="form-row"><label data-i18n="page.types.codePrefixLabel">코드 접두어 * (영문 2~5자)</label><input type="text" id="typeCodePrefix" placeholder="예: MTR" data-i18n-placeholder="page.types.codePrefixPlaceholder" maxlength="5" style="text-transform:uppercase;" /></div>
      <div class="form-row"><label data-i18n="common.col.description">설명</label><textarea id="typeDesc" rows="3" placeholder="예: 각종 구동 모터" data-i18n-placeholder="page.types.descPlaceholder"></textarea></div>
      <div class="form-actions">
        <button class="btn" onclick="DCL.closeModal('typeModalOverlay')" data-i18n="common.cancel">취소</button>
        <button class="btn btn-primary" id="saveTypeBtn" data-i18n="common.save">저장</button>
      </div>
    </div>
  </div>
</div>

<!-- 점검항목 등록/수정 모달 -->
<div class="modal-overlay" id="itemModalOverlay">
  <div class="modal" style="width:520px;">
    <div class="modal-header"><h3 id="itemModalTitle" data-i18n="page.types.itemModalTitleNew">점검항목 추가</h3><div class="modal-close" onclick="DCL.closeModal('itemModalOverlay')">✕</div></div>
    <div class="modal-body">
      <input type="hidden" id="itemId" />
      <div class="form-grid">
        <div class="form-row"><label data-i18n="common.orderLabel">순서</label><input type="number" id="itemOrder" value="1" min="1" /></div>
        <div class="form-row"><label data-i18n="common.judgeTypeLabel">판정유형 *</label>
          <select id="itemJudgeType">
            <option value="OX" data-i18n="judge.OX">OX (정상/이상)</option>
            <option value="NUMERIC" data-i18n="judge.NUMERIC">수치 (상/하한 기준)</option>
            <option value="SELECT" data-i18n="judge.SELECT">선택형</option>
          </select>
        </div>
      </div>
      <div class="form-row"><label data-i18n="page.types.itemNameLabel">점검항목명 *</label><input type="text" id="itemName" placeholder="예: 이상소음/진동" data-i18n-placeholder="page.types.itemNamePlaceholder" /></div>
      <div class="form-grid" id="numericFields" style="display:none;">
        <div class="form-row"><label data-i18n="common.unitLabel">단위</label><input type="text" id="itemUnit" placeholder="예: ℃" data-i18n-placeholder="page.types.unitPlaceholder" /></div>
        <div class="form-row"><label data-i18n="common.lowerLimitLabel">하한</label><input type="number" id="itemLower" /></div>
        <div class="form-row"><label data-i18n="common.upperLimitLabel">상한</label><input type="number" id="itemUpper" /></div>
      </div>
      <div class="form-row" id="selectFields" style="display:none;">
        <label data-i18n="page.types.selectOptionsLabel">선택 옵션 (콤마로 구분, 첫번째 이외는 이상판정)</label>
        <input type="text" id="itemSelectOptions" placeholder="예: 정상,마모,누유" data-i18n-placeholder="page.types.selectOptionsPlaceholder" />
      </div>
      <div class="form-row"><label><input type="checkbox" id="itemPhotoRequired" style="width:auto; margin-right:6px;" /><span data-i18n="page.types.photoRequiredLabel">이상 발견 시 사진 첨부 필수</span></label></div>
      <div class="form-actions">
        <button class="btn" onclick="DCL.closeModal('itemModalOverlay')" data-i18n="common.cancel">취소</button>
        <button class="btn btn-primary" id="saveItemBtn" data-i18n="common.save">저장</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/types.js"></script>
</body>
</html>
