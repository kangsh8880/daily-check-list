<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>점검 수행 - K1 일상점검</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="assets/icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar no-print">
    <div class="brand"><div class="logo-badge">K1</div><div><div class="title">일상점검</div><div class="subtitle">Daily Check List</div></div></div>
    <nav id="sidebarNav"></nav>
    <div class="nav-section-label">계정</div>
    <div id="sidebarWho" style="padding:0 8px 10px;"></div>
    <div class="nav-item" id="logoutBtn"><span class="ico">↩️</span><span>로그아웃</span></div>
  </aside>

  <div class="main">
    <div class="topbar no-print">
      <div><div class="page-title">점검 수행</div><div class="page-desc">QR을 스캔하고 점검항목을 입력하세요</div></div>
      <div class="topbar-right"><button class="theme-toggle" id="themeToggle">🌙</button></div>
    </div>

    <div class="mobile-shell">
      <div id="offlineBanner" class="offline-banner" style="display:none;">
        📶 오프라인 상태입니다. 입력한 점검결과는 기기에 임시 저장되며, 연결이 복구되면 자동 전송됩니다.
        <span id="queueCount"></span>
      </div>

      <!-- 1) 스캔 화면 -->
      <div id="scanStep">
        <div class="card">
          <div class="card-head mb-0"><h3>QR 스캔</h3><span class="hint" id="scanHint">카메라를 부품의 QR에 비춰주세요</span></div>
          <div class="scan-box"><div id="reader" style="width:100%;height:100%;"></div></div>
          <div class="mt-14 flex gap-8">
            <button class="btn" id="startScanBtn">📷 스캔 시작</button>
            <button class="btn" id="stopScanBtn" style="display:none;">중지</button>
          </div>
          <div class="divider"></div>
          <div class="form-row mb-0">
            <label>또는 부품코드 직접 입력</label>
            <div class="flex gap-8"><input type="text" id="manualCode" placeholder="예: MTR-0001" style="text-transform:uppercase;"/><button class="btn btn-primary" id="manualLoadBtn">불러오기</button></div>
          </div>
        </div>

        <div class="card">
          <div class="card-head mb-0"><h3>내 담당 부품</h3><span class="hint">오늘 점검 현황</span></div>
          <div id="myPartsList"><div class="empty-state">불러오는 중...</div></div>
        </div>
      </div>

      <!-- 2) 점검 입력 화면 -->
      <div id="inspectStep" style="display:none;">
        <div class="card">
          <div class="flex-between">
            <div>
              <div class="text-mute fs-xs">부품코드</div>
              <div class="mono fs-lg fw-800" id="curPartCode">-</div>
              <div id="curPartName" class="fw-700"></div>
              <div class="text-mute fs-xs" id="curPartMeta"></div>
            </div>
            <button class="btn btn-sm" id="backToScanBtn">↩️ 취소</button>
          </div>
          <div id="todayBadge" class="mt-8"></div>
        </div>

        <div id="checklistArea"></div>

        <div class="form-row">
          <label>종합 의견 (선택)</label>
          <textarea id="inspectionNote" rows="2" placeholder="특이사항이 있으면 입력하세요"></textarea>
        </div>

        <button class="btn btn-primary fs-md" id="submitInspectionBtn" style="width:100%; padding:13px;">점검결과 저장</button>
      </div>

      <!-- 3) 완료 화면 -->
      <div id="doneStep" style="display:none;">
        <div class="card" style="text-align:center; padding:30px 18px;">
          <div id="doneIcon" class="icon-lg">✅</div>
          <div id="doneTitle" class="fs-lg fw-800 mt-8">점검이 저장되었습니다</div>
          <div id="doneDesc" class="text-mute mt-8 fs-sm"></div>
          <div class="flex gap-8 mt-14" style="justify-content:center;">
            <button class="btn btn-primary" id="scanNextBtn">다음 부품 스캔</button>
            <a class="btn" href="dashboard.html">대시보드로</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/ai-config.js"></script>
<script src="js/common.js"></script>
<script src="js/ai.js"></script>
<script src="js/inspect.js"></script>
</body>
</html>
