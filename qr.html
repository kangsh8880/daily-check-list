<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="page.qr.pageTitle">QR 발행/재발행 - K1 일상점검</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="assets/icon-192.png" />
<style>
  .label-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  @media (max-width:900px){ .label-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:480px){ .label-grid{ grid-template-columns:repeat(2,1fr); gap:8px; } }
  .print-label{ border:1px solid var(--border); border-radius:8px; padding:10px; text-align:center; background:#fff; }
  .print-label canvas{ width:100%; max-width:150px; height:auto; }
  .print-label .code{ font-family:monospace; font-weight:800; font-size:17px; margin-top:4px; color:#000; word-break:break-all; }
  .print-label .name{ font-size:14px; color:#333; margin-top:2px; }
  @media print{
    .content > .card:not(#printCard){ display:none; }
    #printCard{ border:none; box-shadow:none; padding:0; }
    .label-grid{ grid-template-columns:repeat(3,1fr); }
  }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar no-print">
    <div class="brand"><div class="logo-badge">K1</div><div><div class="title" data-i18n="common.brandTitle">일상점검</div></div></div>
    <nav id="sidebarNav"></nav>
    <div class="nav-section-label" data-i18n="common.accountLabel">계정</div>
    <div id="sidebarWho" style="padding:0 8px 10px;"></div>
    <div class="nav-item" id="logoutBtn"><span class="ico">↩️</span><span data-i18n="common.logout">로그아웃</span></div>
  </aside>

  <div class="main">
    <div class="topbar no-print">
      <div><div class="page-title" data-i18n="page.qr.title">QR 발행 / 재발행</div><div class="page-desc" data-i18n="page.qr.desc">부품 QR을 생성해 인쇄하고, 훼손된 QR은 재발행합니다</div></div>
      <div class="topbar-right"><button class="theme-toggle" id="themeToggle">🌙</button></div>
    </div>

    <div class="content">
      <div class="card no-print">
        <div class="card-head">
          <h3 data-i18n="page.qr.partSelectTitle">부품 선택</h3>
          <div class="flex gap-8">
            <select id="filterType" style="width:170px;"><option value="" data-i18n="common.allTypes">전체 유형</option></select>
            <input type="text" id="searchInput" placeholder="부품명/코드 검색" data-i18n-placeholder="page.qr.searchPlaceholder" style="width:180px;" />
            <button class="btn" id="selectAllBtn" data-i18n="page.qr.selectAllBtn">전체 선택</button>
            <button class="btn btn-primary" id="printSelectedBtn" data-i18n="page.qr.printBtn">🖨️ 선택 항목 인쇄</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th style="width:36px;"><input type="checkbox" id="checkAll"/></th><th data-i18n="common.col.partCode">부품코드</th><th data-i18n="common.col.partName">부품명</th><th data-i18n="common.col.type">유형</th><th data-i18n="common.col.qrVersion">QR버전</th><th data-i18n="page.qr.colFirstIssued">최초발행</th><th style="width:210px;" data-i18n="common.col.manage">관리</th></tr></thead>
            <tbody id="partsBody"><tr><td colspan="7" class="empty-state" data-i18n="common.loading">불러오는 중...</td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="card" id="printCard">
        <div class="card-head no-print"><h3 data-i18n="page.qr.previewTitle">인쇄 미리보기</h3><span class="hint" data-i18n="page.qr.previewHint">라벨 프린터/일반 프린터로 인쇄하세요 (Ctrl+P)</span></div>
        <div class="label-grid" id="printArea"><div class="empty-state no-print" data-i18n="page.qr.printAreaEmpty">인쇄할 부품을 선택 후 '선택 항목 인쇄'를 눌러주세요</div></div>
      </div>
    </div>
  </div>
</div>

<!-- 재발행 모달 -->
<div class="modal-overlay" id="reissueModalOverlay">
  <div class="modal" style="width:460px;">
    <div class="modal-header"><h3 data-i18n="page.qr.reissueModalTitle">QR 재발행</h3><div class="modal-close" onclick="DCL.closeModal('reissueModalOverlay')">✕</div></div>
    <div class="modal-body">
      <input type="hidden" id="reissuePartId" />
      <div class="text-mute fs-xs" style="margin-bottom:10px;" id="reissueTarget"></div>
      <div class="form-row"><label data-i18n="page.qr.reissueReasonLabel">재발행 사유</label><textarea id="reissueReason" rows="3" placeholder="예: 라벨 마모로 QR 인식 불가" data-i18n-placeholder="page.qr.reissueReasonPlaceholder"></textarea></div>
      <div class="form-actions">
        <button class="btn" onclick="DCL.closeModal('reissueModalOverlay')" data-i18n="common.cancel">취소</button>
        <button class="btn btn-primary" id="confirmReissueBtn" data-i18n="page.qr.reissueBtn">재발행</button>
      </div>
      <div class="divider"></div>
      <div class="hint fs-xs fw-700" style="margin-bottom:6px;" data-i18n="page.qr.reissueHistoryLabel">재발행 이력</div>
      <div id="reissueHistory" class="table-wrap"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/qr.js"></script>
</body>
</html>
