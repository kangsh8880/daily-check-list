<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>조치 관리 - K1 일상점검</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="assets/icon-192.png" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="logo-badge">K1</div><div><div class="title">일상점검</div><div class="subtitle">Daily Check List</div></div></div>
    <nav id="sidebarNav"></nav>
    <div class="nav-section-label">계정</div>
    <div id="sidebarWho" style="padding:0 8px 10px;"></div>
    <div class="nav-item" id="logoutBtn"><span class="ico">↩️</span><span>로그아웃</span></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div><div class="page-title">조치 관리</div><div class="page-desc">이상 발견 → 담당자 지정 → 조치완료 → 승인의 2단계 검증 프로세스</div></div>
      <div class="topbar-right"><button class="theme-toggle" id="themeToggle">🌙</button></div>
    </div>

    <div class="content">
      <div class="grid grid-4">
        <div class="kpi-tile"><div class="kpi-label">대기(OPEN)</div><div class="kpi-value" id="kpiOpen">0</div></div>
        <div class="kpi-tile"><div class="kpi-label">조치중</div><div class="kpi-value" id="kpiProgress">0</div></div>
        <div class="kpi-tile"><div class="kpi-label">완료대기(승인전)</div><div class="kpi-value" id="kpiDone">0</div></div>
        <div class="kpi-tile"><div class="kpi-label unit-alert">기한초과</div><div class="kpi-value unit-alert" id="kpiOverdue">0</div></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h3>조치 목록</h3>
          <div class="flex gap-8">
            <select id="filterStatus">
              <option value="">전체 상태</option>
              <option value="OPEN">대기</option>
              <option value="IN_PROGRESS">조치중</option>
              <option value="DONE">완료(승인대기)</option>
              <option value="APPROVED">승인완료</option>
              <option value="REJECTED">반려</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>부품</th><th>이상내용</th><th>심각도</th><th>담당자</th><th>기한</th><th>상태</th><th style="width:220px;">처리</th></tr></thead>
            <tbody id="actionsBody"><tr><td colspan="7" class="empty-state">불러오는 중...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 담당자 지정 모달 -->
<div class="modal-overlay" id="assignModalOverlay">
  <div class="modal" style="width:440px;">
    <div class="modal-header"><h3>조치 담당자 지정</h3><div class="modal-close" onclick="DCL.closeModal('assignModalOverlay')">✕</div></div>
    <div class="modal-body">
      <input type="hidden" id="assignActionId" />
      <div class="form-row"><label>담당자 *</label><select id="assignAssignee"></select></div>
      <div class="form-grid">
        <div class="form-row"><label>심각도</label>
          <select id="assignSeverity"><option value="MINOR">경미</option><option value="MAJOR">중대</option><option value="CRITICAL">긴급</option></select>
        </div>
        <div class="form-row"><label>조치기한</label><input type="date" id="assignDue" /></div>
      </div>
      <div class="form-actions">
        <button class="btn" onclick="DCL.closeModal('assignModalOverlay')">취소</button>
        <button class="btn btn-primary" id="confirmAssignBtn">지정</button>
      </div>
    </div>
  </div>
</div>

<!-- 조치완료 등록 모달 -->
<div class="modal-overlay" id="completeModalOverlay">
  <div class="modal" style="width:460px;">
    <div class="modal-header"><h3>조치 완료 등록</h3><div class="modal-close" onclick="DCL.closeModal('completeModalOverlay')">✕</div></div>
    <div class="modal-body">
      <input type="hidden" id="completeActionId" />
      <div class="form-row"><label>조치 내용 *</label><textarea id="completeTaken" rows="3" placeholder="예: 센서 교체 및 배선 점검 완료"></textarea></div>
      <div class="form-row"><label>조치 사진 (권장)</label><input type="file" accept="image/*" capture="environment" id="completePhoto" /><div id="completePhotoPreview"></div></div>
      <div class="form-actions">
        <button class="btn" onclick="DCL.closeModal('completeModalOverlay')">취소</button>
        <button class="btn btn-success" id="confirmCompleteBtn">완료 등록</button>
      </div>
    </div>
  </div>
</div>

<!-- 상세/승인 모달 -->
<div class="modal-overlay" id="reviewModalOverlay">
  <div class="modal" style="width:480px;">
    <div class="modal-header"><h3>조치 승인</h3><div class="modal-close" onclick="DCL.closeModal('reviewModalOverlay')">✕</div></div>
    <div class="modal-body" id="reviewBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/ai-config.js"></script>
<script src="js/common.js"></script>
<script src="js/ai.js"></script>
<script src="js/actions.js"></script>
</body>
</html>
